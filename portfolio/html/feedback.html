<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
        <title>Rubyfire</title>
        <link rel="icon" type="image/png" sizes="32x32" href="../images/redflame.png">
        <link rel="stylesheet" href="../css/index.css">
        
    </head>
    <body>
        <header>
            <h1><a href="../index.html" id="h1">My Portfolio</a></h1>
        </header>
        <div class="content">
            <nav id="nav">
                <ul>
                    <li>
                        <a href="projects.html" id="projects-btn" class="navbutton"><button>Projects &rarr;</button></a>
                    </li>
                    <li>
                        <a href="about.html" id="about-btn" class="navbutton"><button>About &rarr;</button></a>
                    </li>
                    <li>
                        <a href="feedback.html" id="feedback-btn" class="navbutton"><button>Feedback &darr;</button></a>
                        <div id="p1">
                            <ul>
                                <li><a href="#form1" id="pagepoint" class="subbutton">feedback form</a></li>
                            </ul>
                        </div>
                    </li>
                    <li>
                        <a href="#contact" id="contact-btn" class="navbutton"><button>Contact </button></a>
                    </li>
                </ul>
            </nav>
            <div class="right-col">
                <main class="infopage">
                    <div id="infopage-content">
                        <section id="form">
                            <div id="form1" class="form">
                                <form action="../html/thanks.html" method="post">
                                    <fieldset>
                                    <legend>Select a feedback type:</legend>
                                        <div>
                                            <input type="radio" id="complaint" name="feedback_type" value="complaint"/>
                                            <label for="complaint">Complaint</label>
                                        </div>
                                        <div>
                                            <input type="radio" id="suggestion" name="feedback_type" value="suggestion"/>
                                            <label for="suggestion">Suggestion</label>
                                        </div>
                                        <div>
                                            <input type="radio" id="praise" name="feedback_type" value="praise" required/>
                                            <label for="praise">Praise</label>
                                        </div>
                                    </fieldset>
                                    <label for="name">name:</label><br>
                                    <input type="text" id="name" name="name" required><br>
                                    <label for="email">Email:</label><br>
                                    <input type="email" id="email" name="email" required><br>
                                    <label for="feedback">Feedback:</label><br>
                                    <textarea id="feedback" name="feedback" rows="5" cols="50" placeholder="Type your message here..." required></textarea><br>
                                    <label for="date">Date:</label><br>
                                    <input type="date" name="book_date" id="book_date" required/><br><br>
                                    <input type="submit" value="Submit">
                                </form> 
                            </div>
                        </section>
                    </div>
                </main>
                <footer>
                    <section id="contact">
                        <div>
                            <h2>Contact Me</h2>
                            <p>You can reach me at example@email.com.</p>
                        </div>
                    </section>
                </footer>
            </div>
        </div>          
    </body>
</html>
